version: 2
updates:
  # Python dependencies, resolved via uv (pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Open dependency-bump PRs against the integration branch, not main.
    # main is the release branch and is reached only via a dev -> main
    # promotion PR, so dependency bumps follow the same dev-first flow.
    target-branch: "dev"
    labels:
      - "dependencies"

  # GitHub Actions used in the workflows (pinned by commit SHA).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    labels:
      - "dependencies"
      - "github-actions"
