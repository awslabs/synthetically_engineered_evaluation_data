[project]
name = "seed-data"
dynamic = ["version"]
description = "AI-powered synthetic document generation pipeline for benchmarking document extraction (IDP/KIE) systems"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "strands-agents",
    "strands-agents-tools",
    "pydantic>=2",
    "reportlab",
    # xhtml2pdf 0.2.14 imports ShowBoundaryValue from reportlab.platypus.frames,
    # which current reportlab (4.5.x) does not provide -> ImportError in the render
    # tool. 0.2.17 fixed that import; require it. See seed_data/tools.py.
    "xhtml2pdf>=0.2.17",
    "weasyprint",
    "pillow",
    "python-dotenv",
    "boto3",
    "jinja2",
    "augraphy",
    "pypdfium2",
    "pypdf",
    "opencv-python",
    "pyyaml",
]

# pip-compatible extras (for `pip install -e ".[dev]"`)
# Note: the `dev` extra must be kept in sync with [dependency-groups].dev below
[project.optional-dependencies]
# Optional structured-data generation stack. pandas and openpyxl are genuinely
# additional; numpy and scipy are already pulled in transitively by the base
# `augraphy` dependency and are pinned here only to state the versions this code
# needs directly. Opt in with `pip install seed-data[structured]`.
structured = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "openpyxl>=3.1",   # engine for --format excel
    "pyarrow>=15.0",   # engine for --format parquet
]
# Everything a user could opt into. Currently just the structured stack, but a
# single install target that stays correct as more extras are added.
all = ["seed-data[structured]"]
dev = [
    # dev implies the full feature set, so `pip install -e ".[dev]"` can run the
    # structured tests instead of skipping them via importorskip.
    "seed-data[all]",
    "pytest",
    "ruff>=0.15,<0.16",
    "mkdocs",
    "mkdocs-material",
    "mkdocs-awesome-nav",
    "mkdocstrings-python",
    "pymdown-extensions",
]

[project.scripts]
seed-data = "seed_data.__main__:main"

[project.urls]
Homepage = "https://github.com/awslabs/synthetically_engineered_evaluation_data"
Repository = "https://github.com/awslabs/synthetically_engineered_evaluation_data"
Documentation = "https://awslabs.github.io/synthetically_engineered_evaluation_data/"
Issues = "https://github.com/awslabs/synthetically_engineered_evaluation_data/issues"

[build-system]
requires = ["setuptools >= 61.0", "wheel", "setuptools-scm >= 8"]
build-backend = "setuptools.build_meta"

# Version is derived from the git tag by setuptools-scm — do not hard-code it.
# Tag a release `vX.Y.Z` (via a GitHub Release) and the build picks up X.Y.Z.
# Untagged/dev builds get a version like 0.0.3.dev2+g<sha>.
[tool.setuptools_scm]

[tool.pytest.ini_options]
# Put src/ on the import path so tests can `import seed_data` without an
# editable install or per-file sys.path hacks.
pythonpath = ["src"]
testpaths = ["tests"]
# Integration tests (tests/integration/) need live AWS credentials; exclude
# them from the default run. Invoke explicitly: uv run pytest tests/integration
addopts = "--ignore=tests/integration"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# prompts/*.md is listed explicitly (reportlab_cheatsheet.md is loaded at runtime
# by stages/document.py) rather than relying on setuptools-scm's git-file finder,
# which would silently drop it if the file were ever untracked.
seed_data = ["schemas/**/*.json", "schemas/**/*.md", "prompts/*.j2", "prompts/*.md", "packets/**/*.json"]

# uv-native dependency groups (for `uv sync`)
# Keep in sync with [project.optional-dependencies] above
[dependency-groups]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "docs"},
]
test = [
    "pytest",
    # structured-generation stack — needed to exercise the structured tests
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "openpyxl>=3.1",
]
lint = [
    # Pin to a minor range so a ruff upgrade can't silently change what the CI
    # lint gate enforces.
    "ruff>=0.15,<0.16",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-awesome-nav",
    "mkdocstrings-python",
    "pymdown-extensions",
]

[tool.uv]
# Wait 7 days before resolving newly published package versions, so a freshly
# compromised or unstable release is not pulled in immediately.
# https://docs.astral.sh/uv/concepts/resolution/#dependency-cooldowns
exclude-newer = "7 days"
default-groups = ["dev"]

[tool.ruff]
# Pin the settings the CI lint gate depends on so local `ruff check` matches CI
# regardless of a contributor's ruff defaults. line-length 88 is ruff's default;
# stated explicitly so it can't drift.
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Pyflakes (F) + a pycodestyle error subset (E). This is the rule set the tree is
# already clean against; `ruff format --check` is deliberately NOT part of the
# gate (the existing code predates any formatter and a full reformat would bury
# the feature diff — run it as a separate, isolated commit if desired).
select = ["F", "E4", "E7", "E9"]
